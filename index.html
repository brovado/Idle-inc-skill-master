<!doctype html><html><head><meta charset='utf-8'><title>Skill Master</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:1100px;margin:auto;padding:20px}button{margin:2px} .card{border:1px solid #333;padding:10px;margin:10px 0} .active{background:#2a5}</style></head><body><h1>Skill Master</h1><div id='current'></div><div class='card'><h2>Skills</h2><div id='skills'></div></div><div class='card'><h2>Map</h2><div id='map'></div></div><div class='card'><h2>Stats</h2><div id='stats'></div></div><script>const K='sm-v1';let G=JSON.parse(localStorage.getItem(K)||'{"task":null,"kills":{},"skills":{"Mining":1,"Woodcutting":1,"Combat":1},"world":0}');const mobs=[['Rat',1],['Wolf',2],['Boar',3],['Bandit',5]];function setTask(t){G.task=t;save();draw()}function save(){localStorage.setItem(K,JSON.stringify(G))}function tick(){if(!G.task)return;if(G.task.type==='mob'){G.kills[G.task.name]=(G.kills[G.task.name]||0)+1;G.skills.Combat+=0.01}else{G.skills[G.task.name]+=0.01}save();draw()}function draw(){current.innerHTML='<div class=card><b>Current Task:</b> '+(G.task?G.task.label:'Idle')+'</div>';skills.innerHTML=['Mining','Woodcutting'].map(s=>s+' Lv '+G.skills[s].toFixed(1)+' <button '+(G.task?.name===s?'class=active':'')+' onclick="setTask({type:\'skill\',name:\''+s+'\',label:\''+s+'\'})">Do</button>').join('<br>');map.innerHTML=mobs.map(m=>m[0]+' Kills:'+(G.kills[m[0]]||0)+' <button '+(G.task?.name===m[0]?'class=active':'')+' onclick="setTask({type:\'mob\',name:\''+m[0]+'\',label:\'Fight '+m[0]+'\'})">Fight</button>').join('<br>');stats.innerHTML='Combat Lv '+G.skills.Combat.toFixed(1);}draw();setInterval(tick,1000);</script></body></html>
