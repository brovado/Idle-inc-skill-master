<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill Master</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1216;color:#e9eef1;font:14px system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2c363d;padding-bottom:12px}.title{font-size:28px;font-weight:800}.sub,.muted{color:#8f9da6}.layout{display:grid;grid-template-columns:250px 1fr 300px;gap:14px;margin-top:14px}.card{background:#171e24;border:1px solid #2b363e;border-radius:9px;padding:14px}.card h2{font-size:15px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.06em}.hero{text-align:center;background:linear-gradient(#1b252c,#131a1f);padding:20px}.avatar{width:92px;height:92px;border-radius:50%;margin:0 auto 10px;background:#33434c;border:3px solid #667983;display:grid;place-items:center;font-size:40px}.level{font-size:18px;font-weight:700}.power{font-size:13px;color:#a9c9dc;margin-top:5px}.hpbox{margin-top:12px;text-align:left}.hpbar{height:8px;background:#3a2424;border-radius:99px;overflow:hidden;margin-top:4px}.hpfill{height:100%;background:#79c47b;transition:width .15s linear}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}.stat{background:#10161a;padding:8px;border-radius:6px}.stat b{display:block;font-size:16px}.nav button{width:100%;text-align:left;background:#202a31;border:1px solid #303d45;margin:3px 0;padding:10px}.nav button.active{background:#2d4852;border-color:#5d8592}.mainhead{display:flex;justify-content:space-between;align-items:end}.world{font-size:24px;font-weight:800}.pill{display:inline-block;padding:3px 7px;border-radius:5px;background:#29363d;color:#b9cbd3;font-size:11px}.activity{border:1px solid #42535d;background:#11181d;border-radius:8px;padding:14px;margin-bottom:14px}.activity .doing{font-size:20px;font-weight:800}.bar{height:10px;background:#29343b;border-radius:99px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#72b5df}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #273139}.row:last-child{border-bottom:0}.small{font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.enemy{background:#11181d;border:1px solid #303c43;border-radius:8px;padding:13px}.enemy.boss{border-color:#865d3e}.enemy h3{margin:0 0 5px}.enemy button{float:right}.log{height:190px;overflow:auto;font-size:12px;color:#aebbc2;background:#10161a;padding:9px;border-radius:6px}button{font:inherit;color:#e9eef1;background:#26333b;border:1px solid #41515b;border-radius:6px;cursor:pointer;padding:7px 11px}button:hover{background:#34454f}.reset{background:#241c1c;border-color:#694646}.enemy button{min-width:68px}.nav button{color:#dfe8ec}button:hover{filter:brightness(1.12)}@media(max-width:950px){.layout{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><div class="title">SKILL MASTER</div><div class="sub">Gather. Craft. Hunt. Make the numbers go brrrrrr.</div></div><button class="reset" onclick="resetGame()">Reset</button></div><div class="layout"><aside><div class="card hero"><div class="avatar">⚔</div><div class="level">Adventurer Lv <span id="advLevel">1</span></div><div class="power">Combat Power <b id="power">1</b></div><div class="hpbox"><div class="small muted">HP <b id="hpText">100 / 100</b></div><div class="hpbar"><div class="hpfill" id="hpBar" style="width:100%"></div></div></div><div class="statgrid"><div class="stat"><span class="muted">Gold</span><b id="gold">0</b></div><div class="stat"><span class="muted">Kills</span><b id="kills">0</b></div></div></div><div class="card nav"><h2>Adventure</h2><button id="mapNav" onclick="view='map';render()">🗺️ Map</button><button id="skillNav" onclick="view='skills';render()">⚒️ Skills</button><button id="inventoryNav" onclick="view='inventory';render()">🎒 Inventory</button><button id="characterNav" onclick="view='character';render()">📜 Character</button></div></aside><main><div class="activity"><div class="muted small">CURRENT ACTIVITY</div><div class="doing" id="task">Idle</div><div id="taskDetail" class="muted">Choose something to do.</div><div class="bar"><div class="fill" id="taskBar" style="width:0%"></div></div><div class="small" id="taskProgress"></div></div><div id="content"></div></main><aside><div class="card"><h2>Adventure Log</h2><div class="log" id="log"></div></div><div class="card"><h2>Quick Stats</h2><div id="quick"></div></div></aside></div></div><script>const K='skill-master-v2';const defs={Mining:['⛏️','Gathering'],Woodcutting:['🪓','Gathering'],Herbalism:['🌿','Gathering'],Fishing:['🎣','Gathering'],Smithing:['🔨','Production'],Alchemy:['⚗️','Production'],Enchanting:['✨','Production'],Jewelcrafting:['💎','Production'],Combat:['⚔️','Combat']};const worlds=[{name:'Little Village',scope:'Village Problem',mobs:[['Rat',1,2,4],['Wolf',2,4,7],['Boar',3,7,11],['Bandit',5,12,20],['Forest Spider',6,18,28],['Wild Hound',7,25,38]],boss:['Bandit Chief',10,70,110]},{name:'The Local Mine',scope:'Town Problem',mobs:[['Kobold',9,45,65],['Cave Bat',10,55,80],['Goblin Miner',12,70,100],['Cave Spider',14,90,130],['Stone Brute',16,120,175],['Goblin Guard',18,155,220]],boss:['Kobold Foreman',25,500,750]},{name:'Road to the City',scope:'Regional Problem',mobs:[['Ogre',28,300,450],['Troll',31,380,560],['Dark Ranger',34,480,700],['Warg',37,600,900],['Cultist',40,750,1100],['Stone Troll',44,950,1400]],boss:['Road Tyrant',55,3000,4500]}];let G=load()||{task:null,world:0,kills:{},gold:0,skills:{},materials:{Copper:0,Pine:0,Herb:0},log:[],player:{level:1,hp:100,maxHp:100,attack:8,defense:2},progress:0};G.progress=Number(G.progress)||0;G.player=G.player||{level:1,hp:100,maxHp:100,attack:8,defense:2};G.player.level=Number(G.player.level)||1;G.player.maxHp=Number(G.player.maxHp)||100;G.player.hp=Math.min(Number(G.player.hp)||G.player.maxHp,G.player.maxHp);G.player.attack=Number(G.player.attack)||8;G.player.defense=Number(G.player.defense)||2;Object.keys(defs).forEach(k=>G.skills[k]??={level:1,xp:0});if(G.task){G.task.duration=actionDurationFor(G.task);G.task.startedAt=Number(G.task.startedAt)||Date.now();G.progress=0}let view='map';
const skillDurations={Mining:5,Woodcutting:6,Herbalism:4,Fishing:8,Smithing:10,Alchemy:10,Enchanting:12,Jewelcrafting:15,Combat:3};
function load(){try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}}
function save(){localStorage.setItem(K,JSON.stringify(G))}
function need(l){return Math.floor(25*Math.pow(l,1.55))}
function fmt(n){if(n<1000)return Math.floor(n);if(n<1e6)return(n/1e3).toFixed(1)+'k';if(n<1e9)return(n/1e6).toFixed(1)+'m';return(n/1e9).toFixed(1)+'b'}
function log(s){G.log.unshift(new Date().toLocaleTimeString()+' — '+s);G.log=G.log.slice(0,60)}
function xp(k,n){let s=G.skills[k];s.xp+=n;while(s.xp>=need(s.level)){s.xp-=need(s.level);s.level++;if(k==='Combat'){G.player.level=s.level;G.player.maxHp=100+(s.level-1)*15;G.player.hp=Math.min(G.player.hp,G.player.maxHp);G.player.attack=8+(s.level-1)*2;G.player.defense=2+Math.floor((s.level-1)/2)}log(k+' reached level '+s.level+'!')}}
function combatPower(){return Math.max(1,Math.floor(G.player.attack+G.player.defense+G.skills.Combat.level*2))}
function enemyDamage(t){return Math.max(1,Math.ceil(t[1]*1.15-G.player.defense))}
function actionDuration(){if(!G.task)return 0;if(Number.isFinite(Number(G.task.duration))&&Number(G.task.duration)>0)return Number(G.task.duration);return actionDurationFor(G.task)}
function setTask(t){t.startedAt=Date.now();t.duration=actionDurationFor(t);G.task=t;G.progress=0;log('Started '+t.label+' · '+t.duration+'s');save();render()}
function actionDurationFor(t){if(!t)return 0;if(t.type==='fight'){let w=worlds[G.world],x=t.boss?w.boss:w.mobs[Number(t.index)];if(!x)return 5;return Math.max(3,+(2+Number(x[1])*.35).toFixed(1))}return Number(skillDurations[t.name])||5}
function stopTask(){G.task=null;G.progress=0;log('Stopped current activity.');save();render()}
function target(){if(!G.task||G.task.type!=='fight')return null;let w=worlds[G.world];return G.task.boss?w.boss:w.mobs[G.task.index]}
function cycleNeed(){return G.task?Number(G.task.duration)||actionDurationFor(G.task):0}
function tick(){
 if(!G.task)return;
 const now=Date.now();if(!G.task.startedAt)G.task.startedAt=now;if(!Number.isFinite(Number(G.task.duration))||Number(G.task.duration)<=0)G.task.duration=actionDurationFor(G.task);const elapsed=Math.max(0,(now-Number(G.task.startedAt))/1000),duration=Math.max(.1,Number(G.task.duration));
 G.progress=Math.min(duration,elapsed);
 if(G.task.type==='fight'){
   const lastHit=Math.floor(elapsed);
   const previousHit=Number(G.task.lastHit)||0;
   if(lastHit>previousHit){
     const hits=lastHit-previousHit;
     G.player.hp=Math.max(0,G.player.hp-enemyDamage(target())*hits);
     G.task.lastHit=lastHit;
     if(G.player.hp<=0){let t=target();log('Defeated by '+t[0]+' · returned to full HP');G.task=null;G.progress=0;G.player.hp=G.player.maxHp;save();render();return}
   }
 }
 if(elapsed>=duration){
   G.progress=0;
   if(G.task.type==='fight'){
     let t=target();G.kills[t[0]]=(G.kills[t[0]]||0)+1;G.gold+=t[3];xp('Combat',t[1]);if(!G.task.boss)G.materials.Copper++;log('Defeated '+t[0]+' ×'+fmt(G.kills[t[0]])+' · +'+t[3]+' gold');G.task.startedAt=Date.now();G.task.lastHit=0;G.progress=0
   }else{
     xp(G.task.name,.7);if(G.task.name==='Mining')G.materials.Copper+=.35;if(G.task.name==='Woodcutting')G.materials.Pine+=.3;if(G.task.name==='Herbalism')G.materials.Herb+=.3;log(G.task.name+' completed a '+duration+'s work cycle.');G.task.startedAt=Date.now();G.task.lastHit=0
   }
 }
 save();render()
}
function skillCard(k){let s=G.skills[k],n=need(s.level);return '<div class="row"><div><b>'+defs[k][0]+' '+k+'</b><div class="small muted">Level '+s.level+' · '+fmt(s.xp)+' / '+fmt(n)+' XP</div></div><button onclick="setTask({type:\'skill\',name:\''+k+'\',label:\''+k+'\'})">Work</button></div>'}function mobCard(m,i,b){let active=G.task&&G.task.type==='fight'&&G.task.index===i&&G.task.boss===b,d=Math.max(3,+(2+m[1]*.35).toFixed(1));return '<div class="enemy '+(b?'boss':'')+'"><button onclick="setTask({type:\'fight\',index:'+i+',boss:'+b+',label:\''+(b?'Fight ':'Hunt ')+m[0]+'\'})">'+(active?'Active':'Hunt')+'</button><h3>'+m[0]+'</h3><div class="small muted">Level '+m[1]+' · '+d+'s action · Reward '+m[3]+' gold</div><div class="small">Kills: <b>'+fmt(G.kills[m[0]]||0)+'</b></div></div>'}function render(){let w=worlds[G.world],t=target();const advLevelEl=document.getElementById('advLevel'),powerEl=document.getElementById('power'),goldEl=document.getElementById('gold'),killsEl=document.getElementById('kills'),hpTextEl=document.getElementById('hpText'),hpBarEl=document.getElementById('hpBar'),taskEl=document.getElementById('task'),taskDetailEl=document.getElementById('taskDetail'),taskBarEl=document.getElementById('taskBar'),taskProgressEl=document.getElementById('taskProgress'),contentEl=document.getElementById('content'),logEl=document.getElementById('log'),quickEl=document.getElementById('quick');advLevelEl.textContent=G.player.level;powerEl.textContent=combatPower();goldEl.textContent=fmt(G.gold);killsEl.textContent=fmt(Object.values(G.kills).reduce((a,b)=>a+b,0));hpTextEl.textContent=Math.ceil(G.player.hp)+' / '+G.player.maxHp;hpBarEl.style.width=(Math.max(0,G.player.hp/G.player.maxHp)*100)+'%';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById(view==='map'?'mapNav':view==='skills'?'skillNav':view==='inventory'?'inventoryNav':'characterNav').classList.add('active');taskEl.textContent=G.task?G.task.label:'Idle';taskDetailEl.textContent=G.task?(G.task.type==='fight'?'Persistent HP · '+Math.ceil(G.player.hp)+' / '+G.player.maxHp+' HP':'Repeats until you choose something else.'):'Choose an activity from the Map or Skills.';const needNow=cycleNeed();const pct=G.task&&needNow>0?Math.min(100,(G.progress/needNow)*100):0;taskBarEl.style.width=pct+'%';taskProgressEl.innerHTML=G.task?'<span>'+G.progress.toFixed(1)+' / '+needNow.toFixed(1)+' seconds</span> <button onclick="stopTask()">Stop Activity</button>':'';if(view==='map')contentEl.innerHTML='<div class="card"><div class="mainhead"><div><div class="world">'+w.name+'</div><div class="muted">'+w.scope+'</div></div><span class="pill">World '+(G.world+1)+'</span></div><p class="muted">Every creature here is available. Pick one and your adventurer keeps hunting it until you choose another activity.</p><h2>Creatures</h2><div class="grid2">'+w.mobs.map((m,i)=>mobCard(m,i,false)).join('')+'</div><h2 style="margin-top:18px">Boss</h2>'+mobCard(w.boss,0,true)+'</div>';else if(view==='skills')contentEl.innerHTML='<div class="card"><h2>Skills</h2><p class="muted">Choose one activity. It repeats until you change it.</p><h2>Gathering</h2>'+Object.keys(defs).filter(k=>defs[k][1]==='Gathering').map(skillCard).join('')+'<h2 style="margin-top:18px">Production</h2>'+Object.keys(defs).filter(k=>defs[k][1]==='Production').map(skillCard).join('')+'<h2 style="margin-top:18px">Combat</h2>'+skillCard('Combat');else if(view==='inventory')contentEl.innerHTML='<div class="card"><h2>Inventory</h2>'+Object.entries(G.materials).map(([k,v])=>'<div class="row"><b>'+k+'</b><span>'+fmt(v)+'</span></div>').join('')+'<div class="row"><b>Gold</b><span>'+fmt(G.gold)+'</span></div></div>';else contentEl.innerHTML='<div class="card"><h2>Character</h2><div class="row"><b>Adventurer Level</b><span>'+G.player.level+'</span></div><div class="row"><b>HP</b><span>'+Math.ceil(G.player.hp)+' / '+G.player.maxHp+'</span></div><div class="row"><b>Attack</b><span>'+G.player.attack+'</span></div><div class="row"><b>Defense</b><span>'+G.player.defense+'</span></div><div class="row"><b>Combat Power</b><span>'+combatPower()+'</span></div><div class="row"><b>Combat Skill</b><span>Level '+G.skills.Combat.level+'</span></div><p class="muted">HP persists between fights. If you die, the current action ends and you return to full HP.</p></div>';logEl.innerHTML=G.log.map(x=>'<div>'+x+'</div>').join('');quickEl.innerHTML='<div class="row"><span>World</span><b>'+w.name+'</b></div><div class="row"><span>Combat</span><b>Lv '+G.skills.Combat.level+'</b></div><div class="row"><span>Task</span><b>'+(G.task?G.task.label:'Idle')+'</b></div>'}function resetGame(){if(confirm('Reset all progress?')){localStorage.removeItem(K);location.reload()}}render();setInterval(tick,100);</script></body></html>
